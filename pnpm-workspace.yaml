packages:
  - playground
  - plugins/*
  - nuxt
  - devtools
  - test-utils
allowBuilds:
  '@ast-grep/cli': true
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: true
  unrs-resolver: false
  '@tailwindcss/oxide': true
overrides:
  '@nuxt/cli>@bomb.sh/tab': 0.0.22
  '@nuxt/devtools': 4.1.0
  twoslash-vue: 0.3.7
ignoreWorkspaceRootCheck: true
shamefullyHoist: true
strictPeerDependencies: false
minimumReleaseAgeExclude:
  - '@clack/core'
  - '@clack/prompts'
  - '@devframes/*'
  - '@vitejs/devtools'
  - '@vitejs/devtools-kit'
  - devframe
  - ignore
  - srvx
  - unimport
  - vue-router@5.3.1
  - zod@4.6.5
