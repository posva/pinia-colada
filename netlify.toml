[build]
command = "pnpm run build && pnpm run docs:build"
ignore = "./scripts/docs-check.sh"
publish = "docs/.vitepress/dist"

[build.environment]
# .nvmrc selects Node 24 for Netlify, ahead of .node-version.
# Node 26 triggers Netlify's old Corepack fallback, which cannot start pnpm 12.
NODE_VERSION = "24"
